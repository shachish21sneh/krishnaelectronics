<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <!-- Hexagon Frame -->
    <path d="M26 2 L48 14 L48 38 L26 50 L4 38 L4 14 Z" stroke="url(#brandGrad)" stroke-width="2.5" fill="none" opacity="0.9" />
    <!-- Inner Circuit Path -->
    <path d="M26 12 L38 19 L38 33 L26 40 L14 33 L14 19 Z" fill="url(#brandGrad)" fill-opacity="0.15" stroke="url(#brandGrad)" stroke-width="1.5" />
    
    <!-- Lightning Bolt / Energy Pulse -->
    <path d="M28 14 L18 28 L25 28 L22 38 L34 24 L27 24 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Tech Nodes -->
    <circle cx="26" cy="2" r="2.5" fill="#06B6D4" />
    <circle cx="48" cy="14" r="2.5" fill="#3B82F6" />
    <circle cx="48" cy="38" r="2.5" fill="#4F46E5" />
    <circle cx="26" cy="50" r="2.5" fill="#06B6D4" />
    <circle cx="4" cy="38" r="2.5" fill="#4F46E5" />
    <circle cx="4" cy="14" r="2.5" fill="#3B82F6" />
  </g>

  <!-- Typography -->
  <text x="68" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="1.5" fill="currentColor">
    KRISHNA
  </text>
  <text x="68" y="48" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#06B6D4">
    ELECTRONICS
  </text>
</svg>
