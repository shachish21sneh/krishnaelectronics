<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" fill="none">
  <defs>
    <!-- Brand Cyan-Blue Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Text Vibrant Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    
    <!-- Accent Lightning Amber-Gold Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(4, 6)">
    <!-- Outer Hexagon Frame -->
    <path d="M28 2 L52 15 L52 41 L28 54 L4 41 L4 15 Z" stroke="url(#brandGrad)" stroke-width="3" fill="#0A1128" fill-opacity="0.9" />
    <!-- Inner Hexagon Accent -->
    <path d="M28 10 L44 19 L44 37 L28 46 L12 37 L12 19 Z" fill="url(#brandGrad)" fill-opacity="0.22" stroke="url(#brandGrad)" stroke-width="1.5" />
    
    <!-- Lightning Bolt / Energy Pulse -->
    <path d="M31 12 L19 29 L27 29 L23 42 L37 25 L29 25 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    
    <!-- Circuit Nodes -->
    <circle cx="28" cy="2" r="3" fill="#00D2FF" />
    <circle cx="52" cy="15" r="3" fill="#3B82F6" />
    <circle cx="52" cy="41" r="3" fill="#6366F1" />
    <circle cx="28" cy="54" r="3" fill="#00D2FF" />
    <circle cx="4" cy="41" r="3" fill="#6366F1" />
    <circle cx="4" cy="15" r="3" fill="#3B82F6" />
  </g>

  <!-- Brand Typography -->
  <!-- "KRISHNA" in Vibrant Glowing Gradient -->
  <text x="72" y="35" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="2" fill="url(#textGrad)">
    KRISHNA
  </text>
  
  <!-- "ELECTRONICS" in Clean Cyan Subtext -->
  <text x="73" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" letter-spacing="4.5" fill="#38BDF8">
    ELECTRONICS
  </text>
</svg>
